# ko build config — one entry per published image.
#
# Image naming (T012): ko's Config has no `image` field — verified via
# ko/pkg/build/config.go: the image name comes from KO_DOCKER_REPO, not
# .ko.yaml. With --bare, KO_DOCKER_REPO is the full image name; without it,
# ko appends an importpath-derived suffix. This project uses per-image
# KO_DOCKER_REPO (e.g. ko.local/kcp-capi-core, ghcr.io/jimmidyson/kcp-capi-core)
# with --bare, so each importpath maps to a distinct ghcr.io/jimmidyson/kcp-capi-*
# repo. See Taskfile image:build and .github/workflows/publish-images.yaml.
#
# Extensibility (T026 / FR-009, research R6): adding a provider is one new
# `builds` entry here:
#   - id: kcp-capi-<name>
#     main: ./providers/<name>/cmd/<name>-manager
# That is sufficient when ko can resolve the nested module from the root
# .ko.yaml (the expected case — `main:` is a filesystem path and ko delegates
# to that directory's module). Fallback from R6: if ko instead fails with
# "does not contain main module" for the new entry, remove that entry here and
# add `providers/<name>/.ko.yaml` with its single builds entry, then teach
# Taskfile image:build to run ko once per PROVIDER_MODULES entry (see R6).
#
# Per research R2, no `defaultBaseImage` override: ko's Wolfi default is used.
#
# Labels (T019 / FR-004): this file does NOT declare `labels:` — OCI labels
# (org.opencontainers.image.version/revision/source and io.kcp-capi.*) are
# injected via Taskfile's `ko --image-label` passthrough at build time. That
# path is chosen because label values derive from `go list -m` (FR-005) and must
# match the versions embedded in longTag (SC-002); deriving them once in the
# Taskfile and passing via --image-label keeps labels == tag-embedded versions.
# .ko.yaml `labels:` is static and would duplicate the derivation. Both ko
# mechanisms set the same OCI image config Labels; --image-label is preferred
# here for provenance consistency. See Taskfile image:build for the invocation.
#
# Smoke (T016): ko build --push=false produces an image whose entrypoint is the
# manager binary (e.g. kcp-capi-core responds to --help). Local verification is
# `task image:verify` (checks labels without a push) and, where docker is
# available, `docker run --rm <image> --help`. CI cannot push to GHCR without
# creds; the publish workflow does the real push on tag/main. No registry push
# is required to validate --help locally — the binary is the same.
builds:
  - id: kcp-capi-core
    main: ./cmd/core-manager
  - id: kcp-capi-kubeadm-bootstrap
    main: ./cmd/kubeadm-bootstrap-manager
  - id: kcp-capi-kubeadm-control-plane
    main: ./cmd/kubeadm-control-plane-manager
  - id: kcp-capi-workspace
    main: ./cmd/workspace-manager
  - id: kcp-capi-dev-infrastructure
    main: ./cmd/dev-infrastructure-manager
  - id: kcp-capi-nutanix-infrastructure
    main: ./providers/nutanix-infrastructure/cmd/nutanix-infrastructure-manager
