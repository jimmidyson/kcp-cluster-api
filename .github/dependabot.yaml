# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
# GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
      interval: "monthly"
  # Let a release settle before proposing it: one that is superseded within
  # days is a pull request nobody needed. Security updates are not delayed.
  cooldown:
    default-days: 7
  groups:
    all-github-actions:
      patterns: [ "*" ]
  commit-message:
      prefix: "build"
  labels:
    - "dependencies"

# Go modules
- package-ecosystem: "gomod"
  directories:
  - "/"
  # The Nutanix provider (providers/nutanix-infrastructure/) is a separate
  # module whose dependencies are aligned with upstream CAPX
  # (nutanix-cloud-native/cluster-api-provider-nutanix). It is intentionally
  # excluded from Dependabot here: bumping its dependencies independently
  # desyncs it from the fork it is built against and from the pins the main
  # module restates. Dependencies move only when the CAPX fork pin moves.
  # See providers/nutanix-infrastructure/DRIFT.md.
  exclude-paths:
  - "providers/nutanix-infrastructure/**"
  # The vendored upstream trees are upstream's dependency graphs, carried as
  # they are and moved only by adopting a new upstream release. A bot edit to
  # one is unrecorded drift, which the drift check would fail. ADR-0005.
  - "third_party/forked/**"
  schedule:
    interval: "weekly"
    day: "monday"
  cooldown:
    default-days: 7
  # A dependency joins the first group whose patterns match it, so the
  # families come before the catch-all.
  groups:
    # One advisory often lands on several modules of a family at once (the
    # OpenTelemetry modules are the usual case). Without this, security
    # updates ignore the groups below and arrive one pull request per module.
    go-mod-security:
      applies-to: security-updates
      patterns: [ "*" ]
    # Families released together and only coherent at one version: a bump of
    # one member alone does not build, and mixed into the catch-all it hides
    # which family broke.
    opentelemetry:
      patterns: [ "go.opentelemetry.io/*" ]
      update-types: [ "patch", "minor" ]
    kcp:
      patterns: [ "github.com/kcp-dev/*" ]
      update-types: [ "patch", "minor" ]
    # Every other patch and minor update in a single pull request. Majors
    # stay one pull request each.
    all-go-mod-patch-and-minor:
      patterns: [ "*" ]
      update-types: [ "patch", "minor" ]
  ignore:
  # Ignore controller-runtime as its upgraded manually.
  - dependency-name: "sigs.k8s.io/controller-runtime"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    # Ignore k8s and its transitives modules as they are upgraded manually together with controller-runtime.
  - dependency-name: "k8s.io/*"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  - dependency-name: "github.com/prometheus/*"
    update-types: [ "version-update:semver-major", "version-update:semver-minor"]
  - dependency-name: "go.etcd.io/*"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  - dependency-name: "google.golang.org/grpc"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  # Note: We have to keep this 100% in sync with k8s.io, so we get exactly the behavior
  # that the k8s.io CEL code expects.
  - dependency-name: "github.com/google/cel-go"
    # Ignore kind as its upgraded manually.
  - dependency-name: "sigs.k8s.io/kind"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    # Bumping the kustomize API independently can break compatibility with client-go as they share k8s.io/kube-openapi as a dependency.
  - dependency-name: "sigs.k8s.io/kustomize/api"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  commit-message:
    prefix: "build"
  labels:
    - "dependencies"

# Documentation site (Hugo + Docsy). Build-time only and nothing ships from
# it, so monthly and in one pull request per ecosystem is enough.
- package-ecosystem: "npm"
  directory: "/docs/site"
  schedule:
    interval: "monthly"
  cooldown:
    default-days: 7
  groups:
    docs-site-npm:
      patterns: [ "*" ]
    docs-site-npm-security:
      applies-to: security-updates
      patterns: [ "*" ]
  commit-message:
    prefix: "build"
  labels:
    - "dependencies"

# The site's Hugo modules (the Docsy theme). A module of its own, outside
# go.work, so an update here touches nothing else.
- package-ecosystem: "gomod"
  directory: "/docs/site"
  schedule:
    interval: "monthly"
  cooldown:
    default-days: 7
  groups:
    docs-site-hugo-modules:
      patterns: [ "*" ]
  commit-message:
    prefix: "build"
  labels:
    - "dependencies"
