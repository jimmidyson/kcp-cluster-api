name: PR check Markdown links

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - '**.md'

# actions/checkout needs contents:read to authenticate against this
# private repo; permissions: {} leaves it unable to fetch and checkout
# fails with "Repository not found".
permissions:
  contents: read

jobs:
  markdown-link-check:
    name: Broken Links
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      # markdown-link-check runs `git diff` against the base branch from
      # inside its own container (mounted from this checkout); it needs
      # the credentials persist-credentials: false would otherwise strip
      # to do that against this private repo.
    - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # tag=v1.1.3
      with:
        use-quiet-mode: 'yes'
        config-file: .markdownlinkcheck.json
        check-modified-files-only: 'yes'
        base-branch: ${{ github.base_ref }}
