name: docs

on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/docs.yaml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['docs/site/**', '.github/workflows/docs.yaml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # hugo.toml sets enableGitInfo, which dates each page from the last
          # commit that touched it. A shallow clone gives every page the same
          # date, so the published site would be wrong rather than merely
          # missing something.
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.161.0'
          extended: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0

      # The build itself lives in a task target, so `task docs:build`
      # reproduces CI locally (FR-014).
      - name: Build site
        run: task docs:build

      # Uploaded on pull requests too, so what publishes on merge is the
      # artefact a reviewer's run already produced, not a differently built
      # one.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/public

  publish:
    name: publish to github pages
    # `push` only fires on main here, so this is "on merge to main".
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # deploy-pages writes the Pages deployment; the OIDC token is how Pages
      # verifies the artefact came from this workflow run.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Pages allows one deployment at a time, and the newest is the one that
    # should win — so queue rather than cancel, and keep the queue separate
    # from the per-ref group above.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Deploys the artefact the build job uploaded. This needs Pages already
      # switched on with GitHub Actions as its source (Settings -> Pages),
      # which is a one-off the workflow cannot do for itself: enabling Pages
      # over the API wants `administration: write`, which `GITHUB_TOKEN`
      # cannot be granted.
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
