name: PR build kcp docs site

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - 'kcp/docs/site/**'

# actions/checkout needs contents:read to authenticate against this
# private repo; permissions: {} leaves it unable to fetch and checkout
# fails with "Repository not found".
permissions:
  contents: read

defaults:
  run:
    working-directory: kcp/docs/site

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # tag=v3.2.1
        with:
          hugo-version: '0.161.0'
          extended: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # tag=v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
