name: PR build kcp docs site

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - 'kcp/docs/site/**'

# Remove all permissions from GITHUB_TOKEN except metadata.
permissions: {}

defaults:
  run:
    working-directory: kcp/docs/site

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # tag=v3.2.1
        with:
          hugo-version: '0.161.0'
          extended: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # tag=v6.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
