name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release
    runs-on: ubuntu-latest
    permissions:
      # Needs write to open the release PR and create the release/tag.
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
