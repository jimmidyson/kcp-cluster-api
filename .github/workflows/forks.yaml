name: forks

# Each vendored upstream tree's own test suite, run only when a pull request
# touches that tree. A change to this project's code cannot alter a vendored
# tree, so `verify` does not run these; a change inside one is the only thing
# that can break them, and that is when they run. ADR-0005.
#
# One workflow rather than one per tree, so that a pull request touching both
# runs both and a reader finds the trees' checks in one place. Which trees
# changed is read from the diff against the base, not from GitHub's path
# filter, because the filter can only start or skip the whole workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'forks/**'
      - '.github/workflows/forks.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: which trees changed
    runs-on: ubuntu-latest
    outputs:
      cluster-api: ${{ steps.diff.outputs.cluster-api }}
      nutanix: ${{ steps.diff.outputs.nutanix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            changed="forks/cluster-api forks/cluster-api-provider-nutanix"
          else
            changed="$(git diff --name-only "$BASE...HEAD" -- forks .github/workflows/forks.yaml | cut -d/ -f1-2 | sort -u)"
          fi
          echo "changed: $changed"
          case "$changed" in *forks/cluster-api\ *|*forks/cluster-api) echo "cluster-api=true" >> "$GITHUB_OUTPUT" ;; esac
          case "$changed" in *forks/cluster-api-provider-nutanix*) echo "nutanix=true" >> "$GITHUB_OUTPUT" ;; esac
          case "$changed" in *.github/workflows/forks.yaml*) echo "cluster-api=true" >> "$GITHUB_OUTPUT"; echo "nutanix=true" >> "$GITHUB_OUTPUT" ;; esac

  cluster-api:
    name: cluster-api's own tests
    needs: [changes]
    if: needs.changes.outputs.cluster-api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@v0.14.0
        with:
          enable-cache: true
      - run: devbox run -- task test:forks:cluster-api

  nutanix:
    name: cluster-api-provider-nutanix's own tests
    needs: [changes]
    if: needs.changes.outputs.nutanix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@v0.14.0
        with:
          enable-cache: true
      - run: devbox run -- task test:forks:nutanix
