name: drift

# Divergence from upstream is measured rather than trusted (Constitution I).
#
# The upstream trees are vendored under forks/ (ADR-0005), so the thing being
# measured is in the pull request: a change under a vendored tree either has
# an entry in that tree's record or it fails here, and the author can fix it.
# The schedule stays because the other side of the measurement — upstream at
# the base commit — is fetched, and a run that could not fetch yesterday
# should not go unnoticed.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'forks/**'
      - 'DRIFT.md'
      - 'cmd/drift/**'
      - 'internal/drift/**'
      # One record per vendored tree. A record outside this list is one the
      # check stops gating; the trees themselves are covered by forks/** above.
      # What does need a new entry per provider is Taskfile:drift, which this
      # workflow runs, so it inherits coverage from there.
      - 'providers/*/DRIFT.md'

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jetify-com/devbox-install-action@v0.14.0
        with:
          enable-cache: true

      - name: Check drift against DRIFT.md
        run: devbox run -- task drift

