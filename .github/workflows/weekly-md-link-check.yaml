name: Weekly check all Markdown links

on:
  schedule:
    # Cron for every Monday at 12:00 UTC.
    - cron: "0 12 * * 1"

# actions/checkout needs contents:read to authenticate against this
# private repo; permissions: {} leaves it unable to fetch and checkout
# fails with "Repository not found".
permissions:
  contents: read

jobs:
  markdown-link-check:
    name: Broken Links
    strategy:
      fail-fast: false
      matrix:
        branch: [ main, release-1.14, release-1.13, release-1.12 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # tag=v1.1.3
        with:
          use-quiet-mode: 'yes'
          config-file: .markdownlinkcheck.json
