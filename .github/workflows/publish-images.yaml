name: publish-images

# Publish the 6 ko-built images to GHCR (T015/T035).
#
# Three ways in:
#   - release-please.yaml calls this workflow (workflow_call) with the tag it
#     has just cut. This is the release path.
#   - push to main publishes :main and :sha-<short>.
#   - workflow_dispatch with a `tag` input republishes an existing release.
#
# Why release-please has to call it: release-please creates the tag and the
# GitHub release with GITHUB_TOKEN, and GitHub starts no workflow run for an
# event GITHUB_TOKEN caused — not `push: tags`, and not `release: published`
# either. Only workflow_dispatch and repository_dispatch are exempt. A trigger
# on either event here is therefore dead for release-please's tags; `push:
# tags` stays only so that a tag pushed by a person still publishes.
#
# Local builds (task image:build, KO_DOCKER_REPO=ko.local) never need GHCR creds (T029).

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (vX.Y.Z).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish (vX.Y.Z). Empty publishes the selected ref.
        required: false
        type: string

# Least privilege; jobs that push elevate via `packages: write` (T035).
permissions:
  contents: read

jobs:
  derive-tags:
    name: derive tags
    runs-on: ubuntu-latest
    outputs:
      repo_version: ${{ steps.tags.outputs.repo_version }}
      capi_version: ${{ steps.tags.outputs.capi_version }}
      capx_version: ${{ steps.tags.outputs.capx_version }}
      k8s_version: ${{ steps.tags.outputs.k8s_version }}
      capi_base: ${{ steps.tags.outputs.capi_base }}
      capi_oci: ${{ steps.tags.outputs.capi_oci }}
      capx_oci: ${{ steps.tags.outputs.capx_oci }}
      git_sha: ${{ steps.tags.outputs.git_sha }}
      short_sha: ${{ steps.tags.outputs.short_sha }}
      ref_name: ${{ steps.tags.outputs.ref_name }}
      ref_type: ${{ steps.tags.outputs.ref_type }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
    steps:
      # Decide what is being published before checking anything out. A called
      # or dispatched run carries the tag as an input: its GITHUB_REF is the
      # caller's (refs/heads/main), so the ref alone would classify a release
      # as a branch build.
      - id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$tag' is not a release tag (vX.Y.Z)"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          else
            # Empty ref: checkout's default, the commit that triggered the run.
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
        with:
          enable-cache: true
      - id: tags
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          # The tag being published is the version, whatever ref the run is on.
          if [[ -n "$TAG" ]]; then
            export REPO_VERSION="$TAG"
          fi
          devbox run -- scripts/image-tags.sh --check
          devbox run -- scripts/image-tags.sh --gha-output
          # Record ref classification for the publish matrix (tag vs branch).
          if [[ -n "$TAG" ]]; then
            echo "ref_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "ref_type=tag" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            echo "ref_name=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
            echo "ref_type=branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref_name=${GITHUB_REF_NAME:-}" >> "$GITHUB_OUTPUT"
            echo "ref_type=unknown" >> "$GITHUB_OUTPUT"
          fi

  publish-tag:
    name: publish (${{ matrix.image }})
    needs: [derive-tags]
    if: needs.derive-tags.outputs.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kcp-capi-core
            importpath: ./cmd/core-manager
          - image: kcp-capi-kubeadm-bootstrap
            importpath: ./cmd/kubeadm-bootstrap-manager
          - image: kcp-capi-kubeadm-control-plane
            importpath: ./cmd/kubeadm-control-plane-manager
          - image: kcp-capi-workspace
            importpath: ./cmd/workspace-manager
          - image: kcp-capi-dev-infrastructure
            importpath: ./cmd/dev-infrastructure-manager
          - image: kcp-capi-nutanix-infrastructure
            importpath: ./providers/nutanix-infrastructure/cmd/nutanix-infrastructure-manager
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.derive-tags.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
        with:
          enable-cache: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tags
        env:
          REPO_VERSION: ${{ needs.derive-tags.outputs.repo_version }}
        run: devbox run -- scripts/image-tags.sh --check
      - name: Build and push ${{ matrix.image }}
        env:
          REPO_VERSION: ${{ needs.derive-tags.outputs.repo_version }}
          CAPI_VERSION: ${{ needs.derive-tags.outputs.capi_version }}
          CAPX_VERSION: ${{ needs.derive-tags.outputs.capx_version }}
          K8S_VERSION: ${{ needs.derive-tags.outputs.k8s_version }}
          CAPI_BASE: ${{ needs.derive-tags.outputs.capi_base }}
          CAPI_OCI: ${{ needs.derive-tags.outputs.capi_oci }}
          CAPX_OCI: ${{ needs.derive-tags.outputs.capx_oci }}
          GIT_SHA: ${{ needs.derive-tags.outputs.git_sha }}
        run: |
          set -euo pipefail
          repo_ver="$REPO_VERSION"
          capi_ver="$CAPI_VERSION"
          capi_oci="$CAPI_OCI"
          capx_ver="$CAPX_VERSION"
          capx_oci="$CAPX_OCI"
          k8s_ver="$K8S_VERSION"
          base="$CAPI_BASE"
          sha="$GIT_SHA"
          common="org.opencontainers.image.source=https://github.com/jimmidyson/kcp-cluster-api,org.opencontainers.image.revision=$sha,org.opencontainers.image.version=$repo_ver,io.kcp-capi.capi-version=$capi_ver,io.kcp-capi.k8s-version=$k8s_ver,io.kcp-capi.capi-base=$base"
          imp="${{ matrix.image }}"
          image="${{ matrix.image }}"
          importpath="${{ matrix.importpath }}"
          if [[ "$image" == "kcp-capi-nutanix-infrastructure" ]]; then
            long="${repo_ver}-capx-${capx_oci}-capi-${capi_oci}"
            tags="${repo_ver},${long},${capx_oci}"
            labels="$common,io.kcp-capi.capx-version=$capx_ver"
          else
            long="${repo_ver}-capi-${capi_oci}"
            tags="${repo_ver},${long},${capi_oci}"
            labels="$common"
          fi
          KO_DOCKER_REPO="ghcr.io/jimmidyson/${image}"
          echo "Publishing $image ($importpath) -> $KO_DOCKER_REPO with tags: $tags"
          KO_DOCKER_REPO="$KO_DOCKER_REPO" devbox run -- ko build --bare --push --platform=linux/amd64,linux/arm64 \
            --tags "$tags" --image-label "$labels" "$importpath"

  publish-branch:
    name: publish branch (${{ matrix.image }} :main/:sha)
    needs: [derive-tags]
    if: needs.derive-tags.outputs.ref_type == 'branch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kcp-capi-core
            importpath: ./cmd/core-manager
          - image: kcp-capi-kubeadm-bootstrap
            importpath: ./cmd/kubeadm-bootstrap-manager
          - image: kcp-capi-kubeadm-control-plane
            importpath: ./cmd/kubeadm-control-plane-manager
          - image: kcp-capi-workspace
            importpath: ./cmd/workspace-manager
          - image: kcp-capi-dev-infrastructure
            importpath: ./cmd/dev-infrastructure-manager
          - image: kcp-capi-nutanix-infrastructure
            importpath: ./providers/nutanix-infrastructure/cmd/nutanix-infrastructure-manager
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.derive-tags.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
        with:
          enable-cache: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tags
        env:
          REPO_VERSION: ${{ needs.derive-tags.outputs.repo_version }}
        run: devbox run -- scripts/image-tags.sh --check
      - name: Build and push ${{ matrix.image }} (:main, :sha-<short>)
        env:
          REPO_VERSION: ${{ needs.derive-tags.outputs.repo_version }}
          CAPI_VERSION: ${{ needs.derive-tags.outputs.capi_version }}
          CAPX_VERSION: ${{ needs.derive-tags.outputs.capx_version }}
          K8S_VERSION: ${{ needs.derive-tags.outputs.k8s_version }}
          CAPI_BASE: ${{ needs.derive-tags.outputs.capi_base }}
          GIT_SHA: ${{ needs.derive-tags.outputs.git_sha }}
          SHORT_SHA: ${{ needs.derive-tags.outputs.short_sha }}
        run: |
          set -euo pipefail
          capi_ver="$CAPI_VERSION"; k8s_ver="$K8S_VERSION"; base="$CAPI_BASE"; sha="$GIT_SHA"; short="$SHORT_SHA"
          common="org.opencontainers.image.source=https://github.com/jimmidyson/kcp-cluster-api,org.opencontainers.image.revision=$sha,org.opencontainers.image.version=main,io.kcp-capi.capi-version=$capi_ver,io.kcp-capi.k8s-version=$k8s_ver,io.kcp-capi.capi-base=$base"
          importpath="${{ matrix.importpath }}"
          image="${{ matrix.image }}"
          if [[ "$image" == "kcp-capi-nutanix-infrastructure" ]]; then
            common="$common,io.kcp-capi.capx-version=$CAPX_VERSION"
          fi
          tags="main,sha-${short}"
          KO_DOCKER_REPO="ghcr.io/jimmidyson/${image}"
          echo "Publishing $image ($importpath) -> $KO_DOCKER_REPO with tags: $tags"
          KO_DOCKER_REPO="$KO_DOCKER_REPO" devbox run -- ko build --bare --push --platform=linux/amd64,linux/arm64 \
            --tags "$tags" --image-label "$common" "$importpath"
