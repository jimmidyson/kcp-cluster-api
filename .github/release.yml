# Categorises the notes GitHub generates for a release, which is what
# release-please asks for once `changelog-type` is `github`.
#
# GitHub categorises by **pull request label** — there is no key here that
# matches a title, a commit message or a Conventional Commits type. The labels
# come from `.github/workflows/conventional-label.yaml`, which derives them from
# the Conventional Commits title already enforced on every pull request. The two
# files are edited together: a label produced there with no category here lands
# in `Other Changes`, and a category here whose label nothing produces is dead.
#
# `dependencies` is the exception, applied by Dependabot itself rather than by
# that workflow.
changelog:
  exclude:
    labels:
      # Applied by the labelling workflow to ci, test, chore and release pull
      # requests — the types `changelog-sections` hides today.
      - ignore-for-release
      # release-please's own release pull request, which should never appear in
      # the notes for the release it is creating.
      - "autorelease: pending"
      - "autorelease: tagged"
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - feature
    - title: Bug Fixes
      labels:
        - bug
    - title: Refactoring
      labels:
        - refactor
    - title: Documentation
      labels:
        - documentation
    - title: Build and Dependencies
      labels:
        - dependencies
        - build
    # Anything unmatched. A pull request opened before the labelling workflow
    # merged carries no label and lands here.
    - title: Other Changes
      labels:
        - "*"
