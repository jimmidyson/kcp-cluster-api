version: '3'

# Fail loudly: an unset variable or a failing pipe stage must not be mistaken
# for success (FR-011).
set: [errexit, nounset, pipefail]

vars:
  BIN: '{{.ROOT_DIR}}/bin'

  # Provider modules are separate Go modules under providers/, one per Cluster
  # API provider whose dependency graph does not belong in this one's. They are
  # listed rather than globbed so that adding one is a deliberate edit here: a
  # module nobody added is a module nothing builds.
  PROVIDER_MODULES: providers/nutanix-infrastructure
  # Pinned. Tooling is installed at fixed versions with the Go toolchain only:
  # no package manager, no environment manager, nothing on the critical path
  # that an ephemeral container has to materialise first (FR-009).
  KCP_VERSION: v0.32.3
  # The container image builder for the deployed scale measurement. A Go
  # module, so it installs with the toolchain alone — no system package
  # manager on the critical path (Constitution, Environment and Tooling
  # Constraints).
  KO_VERSION: v0.18.0
  # A local cluster for `task test:scale:kind`. A Go module like the rest,
  # so it installs with the toolchain alone.
  KIND_VERSION: v0.32.0
  # The release-please CLI, pinned to the version CI resolves:
  # googleapis/release-please-action v5.0 — the pin in
  # .github/workflows/release-please.yaml — depends on release-please ^17.6.0.
  # Local and CI must run the same code, because two versions of this tool can
  # reach two different answers about the next release from the same commits.
  RELEASE_PLEASE_VERSION: 17.11.1
  GOOS_:
    sh: go env GOOS
  GOARCH_:
    sh: go env GOARCH

tasks:
  default:
    desc: List available targets
    cmds:
      - task --list
    silent: true

  verify:
    desc: The done-condition. Every step, with three outcomes — see contracts/task-surface.md
    deps: [build:verify]
    cmds:
      # Runs the built binary, not `go run`: `go run` exits 1 for any non-zero
      # program status, which collapses "could not run" (2) into "failed" (1)
      # and destroys the distinction FR-012 requires.
      - '{{.BIN}}/verify'

  check:
    desc: The fast subset — everything needing no container runtime or external service
    deps: [build:verify]
    cmds:
      - '{{.BIN}}/verify --fast'

  build:verify:
    desc: Build the verification harness into bin/
    cmds:
      - go build -o {{.BIN}}/verify ./cmd/verify

  build:
    desc: Compile all binaries
    cmds:
      - go build ./...
      # Nested modules are not reached by ./... and so are not built, linted or
      # tested by it. A provider module left out of these three is a module CI
      # never compiles, which is how it stops compiling.
      - for: {var: PROVIDER_MODULES}
        cmd: cd {{.ITEM}} && go build ./...

  lint:
    desc: Static analysis
    cmds:
      - go vet ./...
      - for: {var: PROVIDER_MODULES}
        cmd: cd {{.ITEM}} && go vet ./...

  test:unit:
    desc: Unit tests
    cmds:
      - go test ./...
      - for: {var: PROVIDER_MODULES}
        cmd: cd {{.ITEM}} && go test ./...

  test:integration:
    desc: Integration tests against a real kcp server
    # Sequential, not `deps`: go-task runs deps in parallel, and each of these
    # starts its own kcp server.
    cmds:
      - task: test:integration:kcp
      - task: test:integration:container-runtime

  test:integration:kcp:
    desc: Integration tests needing only a real kcp server, no container runtime
    deps: [tools]
    cmds:
      # The step bound is well above the sum of what a healthy run takes
      # (about eight minutes). It exists to stop a hung suite running forever,
      # not to bound a slow one: the per-package budgets do that, and this has
      # to leave room for all of them on a shared two-core runner.
      #
      # PATH is set on the command, not in a top-level `env:` block: go-task
      # silently ignores `env: PATH:`, so bin/ never reached the test process
      # and the kcp fixture failed with "kcp: executable file not found in
      # $PATH" on a runner where the binary had just been downloaded into it.
      #
      # PATH is the right mechanism despite what the fixture's failure hint
      # says. KCP_BINARIES_DIR only controls whether that hint is printed; the
      # fixture resolves the server as a bare "kcp" and relies on lookup.
      #
      # -p 2 rather than go test's default of GOMAXPROCS. Every package here
      # starts its own kcp server with an embedded etcd, so the default brings
      # four up at once on a four-core runner and they contend for the CPU each
      # needs to reach readiness in time. The `test:integration` target above
      # already avoids exactly this between its two children; nothing in these
      # tests calls t.Parallel(), so the concurrency inside this one is go
      # test's default rather than anything the tests asked for.
      #
      # Two rather than one: it halves how many servers compete to start while
      # keeping most of the wall-clock saving, and the diagnosis is inferred
      # from three bring-up failures across two environments rather than
      # measured, so this is the smaller step that tests it. If bring-up flakes
      # again at two - a readiness timeout, or discovery answering "the server
      # is currently unable to handle the request" - go to -p 1 rather than
      # re-running. The serial sum is the eight minutes the bound above already
      # allows for.
      - PATH="{{.BIN}}:$PATH" go test -tags=integration -timeout=40m -p 2 ./test/integration ./test/integration/providerwiring/... ./test/integration/demo/... ./test/integration/claims/... ./test/integration/onboarding/... ./test/integration/bootstrap/... ./test/integration/teardown/...

  demo:
    desc: Build a ready cluster in each of several kcp workspaces from one manager, and watch it happen
    deps: [tools]
    # Not part of `verify`: the demo is for a person to watch, and what it
    # demonstrates is asserted by ./test/integration/demo, which verify does
    # run. Both drive the same package, so a demo that breaks fails CI.
    #
    # It starts its own single-shard kcp server under .demo/ and stops it on
    # the way out. Point it at one you already have with --kcp-kubeconfig.
    vars:
      DEMO_FLAGS: '{{.DEMO_FLAGS | default ""}}'
    cmds:
      - PATH="{{.BIN}}:$PATH" go run ./cmd/demo {{.DEMO_FLAGS}}

  test:sweep:
    desc: Measure per-workspace resource usage across a sweep of active workspaces
    deps: [tools]
    cmds:
      # -count=1 defeats the test cache. A cached pass would report the last
      # run's numbers as this run's, which for a measurement is not a saving
      # but a wrong answer.
      #
      # Seven shapes run here, sized independently so widening a cheap one does
      # not widen an expensive one by accident. One per deployment, because a
      # workspace is engaged by each of them and a single aggregate would hide
      # which one a regression is in:
      #
      #   SWEEP_WORKSPACES / SWEEP_OBJECTS                     (default 4 / 5)
      #     one controller watching one type — bin/sweep-report.{md,json}
      #   SWEEP_CORE_WORKSPACES / SWEEP_CORE_OBJECTS           (default 3 / 1)
      #     cmd/core-manager — bin/sweep-report-core.{md,json}
      #   SWEEP_BOOTSTRAP_WORKSPACES / SWEEP_BOOTSTRAP_OBJECTS (default 3 / 1)
      #     cmd/kubeadm-bootstrap-manager — bin/sweep-report-bootstrap.{md,json}
      #   SWEEP_CONTROLPLANE_WORKSPACES / ..._OBJECTS          (default 3 / 1)
      #     cmd/kubeadm-control-plane-manager —
      #     bin/sweep-report-controlplane.{md,json}
      #   SWEEP_DEV_WORKSPACES / SWEEP_DEV_OBJECTS             (default 3 / 1)
      #     cmd/dev-infrastructure-manager — bin/sweep-report-dev.{md,json}
      #   SWEEP_WORKSPACE_WORKSPACES / SWEEP_WORKSPACE_OBJECTS (default 3 / 1)
      #     cmd/workspace-manager — bin/sweep-report-workspace.{md,json}
      #   SWEEP_FLEET_WORKSPACES / SWEEP_FLEET_OBJECTS         (default 2 / 1)
      #     every provider's controllers on one fleet, taken to an initialized
      #     control plane — bin/sweep-report-fleet.{md,json}
      #
      # A quantifying run is `SWEEP_WORKSPACES=100 task test:sweep`.
      - PATH="{{.BIN}}:$PATH" go test -tags=integration -timeout=90m -count=1 -v ./test/integration/sweep/...
      # The addition, from the reports the run just wrote. It fails when a
      # deployment is missing, because a sum of three of the four is not what
      # an installation pays and must not be quoted as though it were.
      - go run ./cmd/sweeptotals -reports {{.BIN}}

  test:integration:container-runtime:
    desc: Integration tests needing a real kcp server and a container runtime
    deps: [tools]
    # Named for the capability rather than for what the suite exercises: the
    # capability is why it is a step of its own, and it is the word
    # verify-result.json reports when the environment lacks one. The suite
    # itself is the dev infrastructure provider's docker backend.
    cmds:
      # A longer bound than the other suites get, because this one waits on
      # real containers: two control planes coming up concurrently, after
      # pulling images a fresh runner does not have. The other suites' 15m
      # would fail on a slow runner rather than on a defect.
      #
      # ARTIFACT_DIR is read by the kcp test fixture — it puts the server's
      # log, its audit log and its object dumps there — and by this suite's
      # own workload diagnostics. Unset, both land in a t.TempDir that Go
      # deletes when the test ends, which is why the CI failure that prompted
      # this could be described and not diagnosed.
      - PATH="{{.BIN}}:$PATH" ARTIFACT_DIR="{{.BIN}}/artifacts" go test -tags=integration -timeout=45m ./test/integration/dockerbackend/...

  test:scale:
    desc: Measure this environment's workspace ceiling and reconcile throughput — evidence, not a gate
    deps: [tools]
    # Deliberately not part of `verify` or `check`. Its output is evidence for
    # capacity decisions, not a pass/fail on every change: making the
    # done-condition depend on a multi-workspace kcp environment would hold
    # unrelated work hostage to it, for the same reason the drift check does not
    # run on every pull request.
    #
    # This used to drive a second sweep as well, with its own load profiles and
    # departure detection. It no longer does: `task test:sweep` is the sweep, and
    # two instruments measuring one process could disagree about it. What is left
    # here is the two measurements that instrument does not make — how many
    # workspaces this environment can create and bind at all, and how reconcile
    # throughput responds to worker count.
    #
    # Read the ceiling's outcome from bin/verify-result.json, not the exit
    # status. A workspace count this environment cannot host reports "could not
    # run", which is never a pass.
    vars:
      # How many workspaces the ceiling probe tries to reach.
      CEILING_TARGET: '{{.CEILING_TARGET | default "32"}}'
      # Worker counts to measure throughput at. Throughput is stated per worker
      # count because the two are not proportional past a point.
      WORKERS: '{{.WORKERS | default "1,2,4,8"}}'
      # Extra flags, e.g. -throughput-workspaces.
      SCALE_FLAGS: '{{.SCALE_FLAGS | default ""}}'
    cmds:
      - PATH="{{.BIN}}:$PATH" go test -tags=integration -timeout=60m -count=1 ./test/integration/scale/...
        -args -ceiling-target={{.CEILING_TARGET}} -throughput-workers={{.WORKERS}} {{.SCALE_FLAGS}}

  test:scale:local:
    desc: Scale a fleet in one process — no cluster needed, and the quickest way to a number
    deps: [tools]
    # Separate from `test:scale` because it is a different size of thing. That
    # task's two measurements finish in a normal test run; this one asks whether
    # this environment can host a fleet somebody has in mind, and the default
    # target below is hours of wall clock and gigabytes of memory. Nothing runs
    # it unless somebody asks for it.
    #
    # Two spreads of the same fleet, deliberately. 200 workspaces holding one
    # cluster each and 20 holding ten each reach the same 200 clusters and the
    # same 10,000 nodes, and the difference between what they cost is the
    # per-workspace term this project exists to make small. One shape measures a
    # sum; the pair separates it.
    #
    # It is evidence, not a gate: like `test:scale` it is deliberately outside
    # `verify` and `check`. A fleet this environment cannot host is reported as
    # the count it reached, and reaching nothing at all is "could not run",
    # which is never a pass.
    vars:
      # `<workspaces>x<clustersPerWorkspace>`, comma separated.
      CLUSTERS: '{{.CLUSTERS | default "200"}}'
      NODES_PER_CLUSTER: '{{.NODES_PER_CLUSTER | default "50"}}'
      # How many of each cluster's nodes are control plane machines. Three is
      # the HA shape, and it is part of the target rather than a detail of it:
      # a control plane machine costs a fake etcd member and API server pod on
      # the in-memory backend where a worker costs a Node and a fake kubelet.
      CONTROL_PLANE_NODES: '{{.CONTROL_PLANE_NODES | default "3"}}'
      # Two spreads of the same fleet: 200 clusters one per workspace and ten
      # per workspace hold the same clusters and the same nodes, and the
      # difference between what they cost is the per-workspace term this
      # project exists to make small. One spread measures a sum; the pair
      # separates it.
      #
      # Empty rather than "1,10": the spread has to divide the cluster count,
      # so a fixed default belongs to a fixed CLUSTERS and turning that down
      # would fail a run over a knob nobody touched. Left empty the fleet
      # derives its own — one per workspace, plus a denser spread when one
      # divides and still leaves workspaces to count.
      CLUSTERS_PER_WORKSPACE: '{{.CLUSTERS_PER_WORKSPACE | default ""}}'
      # Percentages of the target to stop and sample at. The target is always
      # the last one, whatever this says.
      TARGET_CHECKPOINTS: '{{.TARGET_CHECKPOINTS | default "10,25,50"}}'
      # How many workspaces are bound and populated at once.
      TARGET_CONCURRENCY: '{{.TARGET_CONCURRENCY | default "16"}}'
      # Wall-clock budget per shape. Reaching it stops that shape and reports
      # what it got to.
      TARGET_BUDGET: '{{.TARGET_BUDGET | default "90m"}}'
      TARGET_FLAGS: '{{.TARGET_FLAGS | default ""}}'
    cmds:
      # ARTIFACT_DIR is read by the kcp test fixture — the server's log, its
      # audit log and its object dumps go there. A run this long that fails
      # without them can be described and not diagnosed.
      #
      # The Go timeout is deliberately above the sum of the per-shape budgets:
      # the budget is what the test enforces and reports against, and letting
      # Go's own timeout fire first would kill the run before it wrote its
      # report, turning a measured shortfall into no measurement at all.
      - PATH="{{.BIN}}:$PATH" ARTIFACT_DIR="{{.BIN}}/artifacts"
        go test -tags=integration -timeout=8h -count=1 -v -run TestFleetTarget ./test/integration/scale/...
        -args -clusters={{.CLUSTERS}}
        -nodes-per-cluster={{.NODES_PER_CLUSTER}}
        -control-plane-nodes={{.CONTROL_PLANE_NODES}}
        -clusters-per-workspace={{.CLUSTERS_PER_WORKSPACE}}
        -target-checkpoints={{.TARGET_CHECKPOINTS}}
        -target-concurrency={{.TARGET_CONCURRENCY}}
        -target-budget={{.TARGET_BUDGET}} {{.TARGET_FLAGS}}

  test:scale:images:
    desc: Build the manager images a cluster run deploys
    deps: [tools:ko]
    # ko rather than a Dockerfile: it builds a Go binary into a distroless base
    # from the module itself, so there is no second description of how these
    # binaries are built that can drift from go.mod.
    #
    # KO_DOCKER_REPO says where they go. For a registry the cluster can pull
    # from, set it to that registry. For kind, `KO_DOCKER_REPO=kind.local`
    # builds and loads into the cluster's nodes in one step, with no registry
    # at all — which is the only part of this that is kind-specific, and it is
    # in an environment variable rather than in the harness.
    #
    # --base-import-paths, not --bare: bare uses KO_DOCKER_REPO as the whole
    # image name, so four binaries would produce four images with one name,
    # each overwriting the last. This names each after its command, which is
    # what the harness expects — <prefix>/<binary>:<tag>.
    requires:
      vars: [KO_DOCKER_REPO]
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default "latest"}}'
    cmds:
      - for: [core-manager, kubeadm-bootstrap-manager, kubeadm-control-plane-manager, dev-infrastructure-manager]
        cmd: KO_DOCKER_REPO={{.KO_DOCKER_REPO}} KIND_CLUSTER_NAME={{.KIND_CLUSTER_NAME}} {{.BIN}}/ko build --base-import-paths --tags={{.IMAGE_TAG}} ./cmd/{{.ITEM}}

  test:scale:kind:
    desc: Scale a fleet on a throwaway local kind cluster — creates it, builds the images, runs
    deps: [tools:kind, tools:ko]
    # The convenience path: everything `test:scale:cluster` needs, arranged for
    # a laptop. It is a wrapper and nothing more — the measurement itself knows
    # nothing about kind, and must not, because a harness that assumed one node
    # could never measure components that are not on the same one.
    #
    # The cluster is reused if it already exists rather than rebuilt each time,
    # because creating one costs a minute and iterating on a run costs many.
    # `task test:scale:kind:down` removes it.
    #
    # Prediction, not a measurement: expect this to want about 3-4 GiB and 2-4
    # vCPU at the default size, on top of the kind node's own ~1.5-2 GiB. The
    # fleet-sized targets are not a laptop proposition — see
    # docs/site/content/en/docs/design/deployed-fleet-measurement.md.
    vars:
      CLUSTER_NAME: '{{.CLUSTER_NAME | default "kcp-scale"}}'
      # Worker nodes, on top of the control-plane node. More than one is what
      # lets SPREAD=true place the managers on different machines, which is the
      # whole reason to care where a component runs.
      WORKERS: '{{.WORKERS | default "0"}}'
    cmds:
      - |
        if ! {{.BIN}}/kind get clusters 2>/dev/null | grep -qx "{{.CLUSTER_NAME}}"; then
          # A config only when workers are asked for: kind's default is a
          # single control-plane node, and writing that out longhand would be
          # the same cluster with more to go wrong.
          if [ "{{.WORKERS}}" -gt 0 ]; then
            {
              echo "kind: Cluster"
              echo "apiVersion: kind.x-k8s.io/v1alpha4"
              echo "nodes:"
              echo "- role: control-plane"
              for _ in $(seq 1 {{.WORKERS}}); do echo "- role: worker"; done
            } | {{.BIN}}/kind create cluster --name "{{.CLUSTER_NAME}}" --config -
          else
            {{.BIN}}/kind create cluster --name "{{.CLUSTER_NAME}}"
          fi
        fi
      # kind.local builds and loads straight into the cluster's nodes, so there
      # is no registry to stand up and nothing to push.
      - task: test:scale:images
        vars:
          KO_DOCKER_REPO: kind.local
          KIND_CLUSTER_NAME: '{{.CLUSTER_NAME}}'
      - task: test:scale:cluster
        vars:
          MANAGER_IMAGE: kind.local
          KUBECONTEXT: 'kind-{{.CLUSTER_NAME}}'
          CLUSTERS: '{{.CLUSTERS}}'
          NODES_PER_CLUSTER: '{{.NODES_PER_CLUSTER}}'
          CONTROL_PLANE_NODES: '{{.CONTROL_PLANE_NODES}}'
          CLUSTERS_PER_WORKSPACE: '{{.CLUSTERS_PER_WORKSPACE}}'
          COMPONENTS: '{{.COMPONENTS}}'
          SPREAD: '{{.SPREAD}}'
          DEPLOYED_FLAGS: '{{.DEPLOYED_FLAGS}}'

  test:scale:kind:down:
    desc: Delete the local kind cluster `task test:scale:kind` created
    deps: [tools:kind]
    vars:
      CLUSTER_NAME: '{{.CLUSTER_NAME | default "kcp-scale"}}'
    cmds:
      - '{{.BIN}}/kind delete cluster --name {{.CLUSTER_NAME}}'

  test:scale:cluster:
    desc: Scale a fleet on a Kubernetes cluster, one Deployment per manager — set KUBECONTEXT to pick one
    deps: [tools]
    # The measurement that removes the caveat every other figure here carries:
    # "four deployments co-located, so one engagement per workspace rather than
    # four". See specs/20260831-210000-deployed-fleet-scale/spec.md.
    #
    # A kubeconfig and nothing else. kind is one way to get a cluster and a
    # real multi-node one is where the figures are worth quoting from; this
    # task cannot tell them apart and must not try.
    #
    # Outside `verify` and `check`, like the other scale measurements: a
    # done-condition that needed a cluster would hold unrelated work hostage.
    # With no cluster reachable the run reports "could not run" and skips,
    # which is distinct from failing.
    vars:
      # Every manager, because a cluster run exists to measure what an
      # installation actually deploys. Narrow it to calibrate against an
      # in-process figure for one of them — COMPONENTS=core-manager is the
      # comparison the reconciliation below was built for, and it measures a
      # weaker end state, since a cluster is taken to readiness by all four.
      COMPONENTS: '{{.COMPONENTS | default "all"}}'
      CLUSTERS: '{{.CLUSTERS | default "8"}}'
      NODES_PER_CLUSTER: '{{.NODES_PER_CLUSTER | default "1"}}'
      CONTROL_PLANE_NODES: '{{.CONTROL_PLANE_NODES | default "1"}}'
      # The same knob as every other scale task, and the same syntax: a list
      # runs each spread in turn. A deployed spread is a whole cluster's worth
      # of deployments, so the run is torn down and stood up again between
      # them rather than deploying both at once. Empty derives it from the
      # cluster count.
      CLUSTERS_PER_WORKSPACE: '{{.CLUSTERS_PER_WORKSPACE | default ""}}'
      CHECKPOINTS: '{{.CHECKPOINTS | default "25,50"}}'
      # The committed in-process run this is checked against. Empty makes the
      # deployed run a second instrument with nothing keeping it honest, which
      # this repository has already decided is worse than one instrument being
      # wrong.
      REFERENCE: '{{.REFERENCE | default "specs/20260820-152056-clusterclass-based-clusters/evidence/sweep-report-core.json"}}'
      # Anti-affinity. Needs a cluster with at least one node per component,
      # and makes every pod unschedulable where there are not — which is the
      # honest failure rather than a co-located run labelled as spread.
      SPREAD: '{{.SPREAD | default "false"}}'
      NAMESPACE: '{{.NAMESPACE | default "kcp-scale"}}'
      # Named rather than "whatever is current": a run that creates workloads
      # should not land wherever the last kubectl command pointed.
      KUBECONTEXT: '{{.KUBECONTEXT | default ""}}'
      KUBECONFIG_PATH: '{{.KUBECONFIG_PATH | default ""}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default "latest"}}'
      # IfNotPresent, not Kubernetes' tag-derived default. `kind.local` loads
      # images onto the nodes with no registry behind them, and Always would
      # send the kubelet looking for one. Set Always for a real registry with a
      # moving tag.
      IMAGE_PULL_POLICY: '{{.IMAGE_PULL_POLICY | default "IfNotPresent"}}'
      DEPLOYED_FLAGS: '{{.DEPLOYED_FLAGS | default ""}}'
    requires:
      vars: [MANAGER_IMAGE]
    cmds:
      # PATH is set on the command rather than in an `env:` block, which go-task
      # silently ignores for PATH — see test:integration:kcp. Without it the
      # guard tests in this package, which start a kcp of their own to check the
      # deployed flags and the readiness probe before a cluster run commits to
      # anything, skip for want of a binary that `tools` has already installed.
      - PATH="{{.BIN}}:$PATH" go test -tags=integration -timeout=4h -count=1 -v ./test/integration/deployed/...
        -args
        -deployed-kcp-image={{.KCP_IMAGE | default (printf "ghcr.io/kcp-dev/kcp:%s" .KCP_VERSION)}}
        -deployed-manager-image={{.MANAGER_IMAGE}}
        -deployed-image-tag={{.IMAGE_TAG}}
        -deployed-image-pull-policy={{.IMAGE_PULL_POLICY}}
        -deployed-components={{.COMPONENTS}}
        -deployed-namespace={{.NAMESPACE}}
        -deployed-context={{.KUBECONTEXT}}
        -deployed-kubeconfig={{.KUBECONFIG_PATH}}
        -deployed-clusters={{.CLUSTERS}}
        -deployed-nodes-per-cluster={{.NODES_PER_CLUSTER}}
        -deployed-control-plane-nodes={{.CONTROL_PLANE_NODES}}
        -deployed-clusters-per-workspace={{.CLUSTERS_PER_WORKSPACE}}
        -deployed-checkpoints={{.CHECKPOINTS}}
        -deployed-reference={{.REFERENCE}}
        -deployed-spread={{.SPREAD}} {{.DEPLOYED_FLAGS}}

  scale:census:
    desc: Count the controllers and watches a deployment registers, by parsing its setup functions
    # The two counts the whole per-workspace cost model turns on. Derived by an
    # AST parse rather than by hand or by grep: the builder's chained calls have
    # no leading dot, so a regex silently misses every Watches() — which is how
    # the first census was wrong in both terms, quietly.
    #
    # Roots are resolved with `go list` because the wired set spans two modules.
    vars:
      SCOPE: '{{.SCOPE | default "wired"}}'
    cmds:
      - |
        CORE=$(go list -m -f '{{`{{.Dir}}`}}' sigs.k8s.io/cluster-api)
        DOCKER=$(go list -f '{{`{{.Dir}}`}}' sigs.k8s.io/cluster-api/test/infrastructure/docker/reconcilers)
        case "{{.SCOPE}}" in
          wired)  ROOTS="$CORE/core/reconcilers/cluster,$CORE/core/reconcilers/machine,$CORE/core/reconcilers/machineset,$CORE/core/reconcilers/machinedeployment,$CORE/core/reconcilers/clusterclass,$CORE/core/reconcilers/topology/cluster,$CORE/core/reconcilers/topology/machinedeployment,$CORE/core/reconcilers/topology/machineset,$CORE/bootstrap/kubeadm/reconcilers/kubeadmconfig,$CORE/controlplane/kubeadm/reconcilers/kubeadmcontrolplane,$CORE/controllers/clustercache,$DOCKER" ;;
          parity) ROOTS="$CORE/core/reconcilers,$CORE/controllers/clustercache" ;;
          *)      ROOTS="{{.SCOPE}}" ;;
        esac
        go run ./cmd/controllercensus -roots "$ROOTS"

  scale:model:
    desc: Fit resource models to the committed sweep runs and report held-out accuracy
    # Arithmetic over committed evidence, not a measurement: it needs no kcp and
    # runs in milliseconds, so a figure can be re-derived or corrected without
    # re-running a sweep. That separation is the point — the runs are the
    # evidence, this is the reading of them.
    vars:
      EVIDENCE_DIR: '{{.EVIDENCE_DIR | default "specs/20260815-211812-workspace-wiring-scale/evidence"}}'
    cmds:
      - go run ./cmd/scalemodel -runs={{.EVIDENCE_DIR}} -out={{.EVIDENCE_DIR}}/model-accuracy.md

  tools:
    desc: Install pinned tooling into bin/
    deps: [tools:kcp]

  tools:kind:
    desc: Install the pinned local-cluster tool into bin/
    status:
      - test -x {{.BIN}}/kind
    cmds:
      - GOBIN={{.BIN}} go install sigs.k8s.io/kind@{{.KIND_VERSION}}

  tools:ko:
    desc: Install the pinned container image builder into bin/
    status:
      - test -x {{.BIN}}/ko
    cmds:
      - GOBIN={{.BIN}} go install github.com/google/ko@{{.KO_VERSION}}

  tools:kcp:
    desc: Download the pinned kcp server binary into bin/
    status:
      - test -x {{.BIN}}/kcp
    cmds:
      - mkdir -p {{.BIN}}
      # `go install github.com/kcp-dev/kcp/cmd/kcp@version` does not work: kcp's
      # go.mod carries replace directives, and `go install pkg@version` refuses
      # any module whose go.mod has them. The release archive sidesteps that.
      - >-
        curl -sSfL
        "https://github.com/kcp-dev/kcp/releases/download/{{.KCP_VERSION}}/kcp_{{trimPrefix "v" .KCP_VERSION}}_{{.GOOS_}}_{{.GOARCH_}}.tar.gz"
        | tar -xzf - -C {{.BIN}} --strip-components=1 bin/kcp

  drift:
    desc: Report each fork's divergence from its base and check it against its record
    cmds:
      # Cluster API's fork, recorded at the root.
      - go run ./cmd/drift
      # One record per fork, and each is checked from the module that pins it:
      # the ref comes from that module's own graph, so a checker run from the
      # wrong directory would measure the wrong version. A fork whose record is
      # not listed here is one nothing checks.
      - cd providers/nutanix-infrastructure && go run github.com/jimmidyson/kcp-cluster-api/cmd/drift
          --record DRIFT.md
          --module github.com/nutanix-cloud-native/cluster-api-provider-nutanix
          --fork https://github.com/jimmidyson/cluster-api-provider-nutanix
          --upstream https://github.com/nutanix-cloud-native/cluster-api-provider-nutanix

  release-please:
    desc: Open the release pull request — run once from main to start a release
    # Why this exists at all, when `.github/workflows/release-please.yaml` runs
    # the same tool on every push to main: GitHub refuses the *creation* of a
    # pull request by GITHUB_TOKEN unless "Allow GitHub Actions to create and
    # approve pull requests" is enabled for the repository. Every run of that
    # workflow does the entire job — parses the commits, writes the changelog,
    # pushes `release-please--branches--main--*` — and then fails on the single
    # API call it is not permitted to make.
    #
    # Updating a pull request that already exists is not creation, and is
    # permitted. So one local run opens the pull request, and the workflow keeps
    # its branch, title and changelog current for every commit that lands before
    # it merges. Deciding to release is the human step; keeping the open release
    # current is CI's.
    #
    # A maintainer's task, deliberately outside `verify` and `check`: it needs
    # Node and a GitHub token, and the graded path may require neither
    # (contracts/task-surface.md).
    #
    # Nothing here reads the working tree. release-please resolves the release
    # entirely from the GitHub API against `--target-branch`, so an uncommitted
    # change or a stale local main cannot affect what it opens. The branch guard
    # below is about which branch you meant to release, not about local state.
    preconditions:
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]'
        msg: Release pull requests are opened from main. Check main out first.
      - sh: command -v npx >/dev/null
        msg: Needs Node for npx — https://nodejs.org. Nothing in `verify` needs it.
      # `gh auth token` is only reached when GITHUB_TOKEN is unset, so gh is a
      # convenience rather than a dependency. The token needs write access to
      # contents and pull requests.
      - sh: '[ -n "${GITHUB_TOKEN:-}" ] || command -v gh >/dev/null'
        msg: Needs a token — set GITHUB_TOKEN, or install gh and run `gh auth login`.
    vars:
      REPO: '{{.REPO | default ""}}'
    silent: true
    cmds:
      # `task release-please -- --dry-run` reports what it would open without
      # opening it.
      - |
        repo="{{.REPO}}"
        if [ -z "$repo" ]; then
          # Take the last two segments of whatever `origin` is, rather than
          # matching on a github.com host. A remote does not have to name that
          # host: an SSH alias (`personalgit:owner/repo`, from an ssh_config
          # Host block, usually paired with `url.<alias>.insteadOf` to force
          # SSH) carries the same repository under a name that exists only on
          # that machine — and is how someone keeps a personal account apart
          # from a managed-user one. Matching on the host produced no match
          # there and passed the whole string through untouched, so
          # release-please read `personalgit` as a host and the rest as a port:
          #
          #   TypeError [ERR_INVALID_ARG_VALUE]: The argument 'url'
          #   https://personalgit:jimmidyson/kcp-cluster-api.
          #   Received 'Invalid port in url'
          #
          # This form is alias-agnostic: it also handles scp-style, https, and
          # ssh:// URLs with an explicit port.
          repo=$(git remote get-url origin | sed -E 's#\.git$##; s#.*[:/]([^/:]+/[^/]+)$#\1#')
        fi

        # Check the shape before handing it over. The bug above was not that
        # the string was wrong; it was that a wrong string went unremarked
        # until Node failed on it three layers down, in a message naming
        # neither this repository nor the remote it came from.
        #
        # Shape only: a remote that is not GitHub's still yields a well-formed
        # `owner/repo` from its last two segments and passes this. That failure
        # surfaces as a 404 from the API, which says enough. `REPO=` is the way
        # out of both.
        if ! printf '%s' "$repo" | grep -qE '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
          echo "could not read owner/repo from origin ($(git remote get-url origin))." >&2
          echo "Got: '$repo'. Pass it explicitly: task release-please REPO=owner/repo" >&2
          exit 1
        fi

        # Spelled out rather than written `"${GITHUB_TOKEN:-$(gh auth token)}"`.
        # go-task runs commands through mvdan/sh, not bash, and that shell
        # evaluates the command substitution in a `:-` default even when the
        # variable is set — so the short form shells out to gh regardless, and
        # under `errexit` a machine with a token but no gh fails at exit 127
        # having never needed it.
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          token="$GITHUB_TOKEN"
        else
          token="$(gh auth token)"
        fi

        npx --yes release-please@{{.RELEASE_PLEASE_VERSION}} release-pr \
          --repo-url "$repo" \
          --target-branch "$(git rev-parse --abbrev-ref HEAD)" \
          --config-file release-please-config.json \
          --manifest-file .release-please-manifest.json \
          --token "$token" \
          {{.CLI_ARGS}}

  pr:sign:
    desc: Re-sign a pull request branch's commits and push it, ready to merge
    # An agent session commits in a container that has no signing key, so its
    # commits reach the branch unsigned. That failure is silent rather than
    # loud: this repository's container has `commit.gpgsign=true`, `gpg.format
    # =ssh` and a `user.signingkey` pointing at a **zero-byte** placeholder, so
    # `git commit` succeeds and produces a commit with no signature at all.
    # Nothing says so until GitHub shows the branch Unverified next to a `main`
    # whose commits are all signed.
    #
    # This pulls such a branch onto a machine that does have the key, rewrites
    # every commit on it with a signature, and pushes the result.
    #
    # Rewriting history is the point here, not a side effect, so the usual rule
    # against it applies with full force: run this only on a branch that is
    # yours. The guard below refuses `main`; it cannot tell whose branch any
    # other one is.
    #
    # The rebase is onto `origin/main` because that is how this project updates
    # an open pull request branch anyway — see AGENTS.md, "Merging and keeping
    # branches current". So one command both signs the branch and brings it
    # current, which is what "ready to merge" means.
    vars:
      PR: '{{.PR | default ""}}'
    # Without this the whole script is echoed before it runs, burying the git
    # output that actually matters. Every command here reports for itself.
    silent: true
    cmds:
      # `task pr:sign PR=97` fetches and checks that pull request out first;
      # bare `task pr:sign` signs whatever branch is already checked out.
      - |
        if [ -n "{{.PR}}" ]; then
          gh pr checkout "{{.PR}}"
        fi

        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then
          echo "refusing to rewrite main. Check out the pull request branch first." >&2
          exit 1
        fi
        if [ -n "$(git status --porcelain)" ]; then
          echo "working tree is dirty; commit or stash before rewriting history." >&2
          exit 1
        fi
        if [ -z "$(git config --get user.signingkey)" ]; then
          echo "no user.signingkey configured — this would rewrite every commit and sign none." >&2
          exit 1
        fi

        git fetch origin main
        # --force-rebase because a branch already on top of main is otherwise a
        # no-op, and a no-op re-creates no commits and so signs nothing. The
        # author and author date of each commit survive; the committer becomes
        # whoever runs this, which is the truth about who signed it.
        git rebase --force-rebase --gpg-sign origin/main

        # Assert the outcome rather than trusting the command that produced it.
        # This exists because the failure it catches has already happened here
        # once, silently, with signing switched on the whole time.
        #
        # The question is whether a signature *exists*, so read the commit
        # object and look for the header that carries one. `gpgsig` covers an
        # OpenPGP or an SSH signature alike, and `gpgsig-sha256` the same in a
        # SHA-256 repository. Only the header block is searched — everything
        # before the first blank line — so a message quoting `gpgsig` cannot
        # pass a commit off as signed.
        #
        # This deliberately does not use `git log %G?`, which answers a
        # different question: whether the signature can be *verified*. With SSH
        # signing and no `gpg.ssh.allowedSignersFile` — the normal state on a
        # machine that signs but has never set up a trust store — verification
        # cannot be attempted at all and `%G?` reports `N`, the same letter it
        # uses for a commit that carries no signature. That made this check
        # reject correctly signed commits and refuse to push them.
        unsigned=
        for commit in $(git rev-list origin/main..HEAD); do
          if ! git cat-file commit "$commit" | sed -n '/^$/q;p' | grep -q '^gpgsig'; then
            unsigned="$unsigned $(git rev-parse --short "$commit")"
          fi
        done
        if [ -n "$unsigned" ]; then
          echo "signing did not take. These commits carry no signature:" >&2
          for c in $unsigned; do echo "  $c" >&2; done
          echo "Nothing has been pushed. Check that user.signingkey names a real key," >&2
          echo "and that gpg.format matches it (ssh for an SSH key)." >&2
          exit 1
        fi

        git push --force-with-lease
        echo "signed and pushed $(git rev-list --count origin/main..HEAD) commit(s) on $branch"

  release-please:sign:
    desc: Sign the open release pull request — run immediately before merging it
    # release-please cannot sign what it writes. Its only signing-adjacent flag
    # is `--signoff`, which appends a `Signed-off-by:` line and is not a
    # signature, and its commits are made through the Git Data API — create
    # tree, create commit, update ref — which signs nothing unless handed a
    # signature it never supplies. So the release branch carries one Unverified
    # commit, and this is how it stops doing so.
    #
    # **Immediately before merging** is not incidental. Every run of the
    # release-please workflow replaces that branch's head with a fresh
    # unsigned commit, so a signature applied earlier is gone the next time
    # anything lands on main. Signing is the last step before the merge button,
    # not something done once when the pull request opens.
    #
    # Whether this is needed at all is worth knowing before reaching for it.
    # GitHub signs the squash merge itself — the commit on main is committed by
    # `web-flow` and carries GitHub's signature whatever the branch looked
    # like — so `main` stays fully signed without this. This is for wanting the
    # pull request itself to read Verified.
    #
    # No gh anywhere in here. Finding the branch is a plain `ls-remote`, which
    # goes through git's own remote handling and so works with an SSH alias
    # (`personalgit:owner/repo`) that gh may not resolve; and `pr:sign` with no
    # PR set signs the branch already checked out, which needs no gh either.
    silent: true
    cmds:
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "working tree is dirty; commit or stash first." >&2
          exit 1
        fi

        git fetch origin
        branches=$(git ls-remote --heads origin 'refs/heads/release-please--*' | sed 's#.*refs/heads/##')
        n=$(printf '%s\n' "$branches" | grep -c . || true)

        if [ "$n" -eq 0 ]; then
          echo "no release branch on origin. Run \`task release-please\` first." >&2
          exit 1
        fi
        if [ "$n" -gt 1 ]; then
          # More than one means several release lines are open at once, and
          # which of them you meant is not this task's guess to make.
          echo "more than one release branch on origin:" >&2
          printf '%s\n' "$branches" >&2
          echo "Check the one you want out, then run \`task pr:sign\`." >&2
          exit 1
        fi

        echo "signing $branches"
        git checkout -B "$branches" "origin/$branches"
      # Signs whatever is now checked out. You are left on the release branch:
      # switch back to main yourself once the pull request is merged.
      - task: pr:sign

  docs:build:
    desc: Build the documentation site
    dir: docs/site
    cmds:
      - npm install
      - npm run build

  clean:
    desc: Remove installed tooling
    cmds:
      - rm -rf {{.BIN}}
