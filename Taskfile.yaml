version: '3'

# Fail loudly: an unset variable or a failing pipe stage must not be mistaken
# for success (FR-011).
set: [errexit, nounset, pipefail]

vars:
  BIN: '{{.ROOT_DIR}}/bin'
  # Pinned. Tooling is installed at fixed versions with the Go toolchain only:
  # no package manager, no environment manager, nothing on the critical path
  # that an ephemeral container has to materialise first (FR-009).
  KCP_VERSION: v0.32.3
  GOOS_:
    sh: go env GOOS
  GOARCH_:
    sh: go env GOARCH

tasks:
  default:
    desc: List available targets
    cmds:
      - task --list
    silent: true

  verify:
    desc: The done-condition. Every step, with three outcomes — see contracts/task-surface.md
    deps: [build:verify]
    cmds:
      # Runs the built binary, not `go run`: `go run` exits 1 for any non-zero
      # program status, which collapses "could not run" (2) into "failed" (1)
      # and destroys the distinction FR-012 requires.
      - '{{.BIN}}/verify'

  check:
    desc: The fast subset — everything needing no container runtime or external service
    deps: [build:verify]
    cmds:
      - '{{.BIN}}/verify --fast'

  build:verify:
    desc: Build the verification harness into bin/
    cmds:
      - go build -o {{.BIN}}/verify ./cmd/verify

  build:
    desc: Compile all binaries
    cmds:
      - go build ./...

  lint:
    desc: Static analysis
    cmds:
      - go vet ./...

  test:unit:
    desc: Unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: Integration tests against a real kcp server
    # Sequential, not `deps`: go-task runs deps in parallel, and each of these
    # starts its own kcp server.
    cmds:
      - task: test:integration:kcp
      - task: test:integration:docker

  test:integration:kcp:
    desc: Integration tests needing only a real kcp server, no container runtime
    deps: [tools]
    cmds:
      # PATH is set on the command, not in a top-level `env:` block: go-task
      # silently ignores `env: PATH:`, so bin/ never reached the test process
      # and the kcp fixture failed with "kcp: executable file not found in
      # $PATH" on a runner where the binary had just been downloaded into it.
      #
      # PATH is the right mechanism despite what the fixture's failure hint
      # says. KCP_BINARIES_DIR only controls whether that hint is printed; the
      # fixture resolves the server as a bare "kcp" and relies on lookup.
      - PATH="{{.BIN}}:$PATH" go test -tags=integration -timeout=15m ./test/integration ./test/integration/providerwiring/...

  test:sweep:
    desc: Measure per-workspace resource usage across a sweep of active workspaces
    deps: [tools]
    cmds:
      # -count=1 defeats the test cache. A cached pass would report the last
      # run's numbers as this run's, which for a measurement is not a saving
      # but a wrong answer.
      #
      # Two shapes run here, sized independently so widening the cheap one
      # does not widen the expensive one by accident:
      #
      #   SWEEP_WORKSPACES / SWEEP_OBJECTS           (default 4 / 5)
      #     one controller watching one type — bin/sweep-report.{md,json}
      #   SWEEP_CORE_WORKSPACES / SWEEP_CORE_OBJECTS (default 3 / 1)
      #     the core-manager reconciler set on the dev provider's in-memory
      #     backend — bin/sweep-report-coremanager.{md,json}
      #
      # A quantifying run is `SWEEP_WORKSPACES=100 task test:sweep`.
      - PATH="{{.BIN}}:$PATH" go test -tags=integration -timeout=90m -count=1 -v ./test/integration/sweep/...

  test:integration:docker:
    desc: Integration tests needing a real kcp server and a container runtime
    deps: [tools]
    cmds:
      - PATH="{{.BIN}}:$PATH" go test -tags=integration -timeout=15m ./test/integration/coremanager/...

  test:scale:
    desc: Measure per-shard capacity against a real kcp server — evidence, not a gate
    deps: [tools]
    # Deliberately not part of `verify` or `check`. Its output is evidence for
    # capacity decisions, not a pass/fail on every change: making the
    # done-condition depend on a multi-workspace kcp environment would hold
    # unrelated work hostage to it, for the same reason the drift check does not
    # run on every pull request.
    #
    # Read the outcome from bin/verify-result.json, not the exit status. A
    # workspace count this environment cannot host reports "could not run",
    # which is never a pass.
    vars:
      # Load profile to measure. Capacity is stated per profile because idle and
      # active workspaces are not interchangeable units of load.
      PROFILE: '{{.PROFILE | default "idle-heavy"}}'
      # Comma-separated workspace counts to sweep, geometrically spaced. The
      # departure point is derived from these, so the set is recorded with the result.
      POINTS: '{{.POINTS | default "1,2,4,8"}}'
      # Fractional deviation from the linear projection that counts as the departure point.
      TOLERANCE: '{{.TOLERANCE | default "0.25"}}'
      # How many watches each workspace registers. Dispatch cost is per
      # listener, so this multiplies fan-out without needing more workspaces.
      # The wired Cluster API set registers roughly 19.
      WATCHES: '{{.WATCHES | default "1"}}'
      # Where the run is written as JSON. A capacity figure has to be
      # re-derivable from the points that produced it, and a test log is not a
      # record — so this defaults to on rather than being opt-in.
      EVIDENCE_DIR: '{{.EVIDENCE_DIR | default "specs/20260815-211812-workspace-wiring-scale/evidence"}}'
      # Extra flags, e.g. --probe-ceiling to report only what this environment
      # can host before designing a sweep against it.
      SCALE_FLAGS: '{{.SCALE_FLAGS | default ""}}'
    cmds:
      # -evidence-dir is absolute: `go test` runs each package in its own
      # directory, so a relative path would land under test/integration/scale
      # rather than in the spec's evidence directory.
      - PATH="{{.BIN}}:$PATH" go test -tags=integration -timeout=60m ./test/integration/scale/...
        -args -profile={{.PROFILE}} -points={{.POINTS}} -tolerance={{.TOLERANCE}}
        -watches-per-workspace={{.WATCHES}} -evidence-dir="{{.ROOT_DIR}}/{{.EVIDENCE_DIR}}" {{.SCALE_FLAGS}}

  scale:model:
    desc: Fit resource models to the committed sweep runs and report held-out accuracy
    # Arithmetic over committed evidence, not a measurement: it needs no kcp and
    # runs in milliseconds, so a figure can be re-derived or corrected without
    # re-running a sweep. That separation is the point — the runs are the
    # evidence, this is the reading of them.
    vars:
      EVIDENCE_DIR: '{{.EVIDENCE_DIR | default "specs/20260815-211812-workspace-wiring-scale/evidence"}}'
    cmds:
      - go run ./cmd/scalemodel -runs={{.EVIDENCE_DIR}} -out={{.EVIDENCE_DIR}}/model-accuracy.md

  tools:
    desc: Install pinned tooling into bin/
    deps: [tools:kcp]

  tools:kcp:
    desc: Download the pinned kcp server binary into bin/
    status:
      - test -x {{.BIN}}/kcp
    cmds:
      - mkdir -p {{.BIN}}
      # `go install github.com/kcp-dev/kcp/cmd/kcp@version` does not work: kcp's
      # go.mod carries replace directives, and `go install pkg@version` refuses
      # any module whose go.mod has them. The release archive sidesteps that.
      - >-
        curl -sSfL
        "https://github.com/kcp-dev/kcp/releases/download/{{.KCP_VERSION}}/kcp_{{trimPrefix "v" .KCP_VERSION}}_{{.GOOS_}}_{{.GOARCH_}}.tar.gz"
        | tar -xzf - -C {{.BIN}} --strip-components=1 bin/kcp

  drift:
    desc: Report the fork's divergence from its base and check it against DRIFT.md
    cmds:
      - go run ./cmd/drift

  docs:build:
    desc: Build the documentation site
    dir: docs/site
    cmds:
      - npm install
      - npm run build

  clean:
    desc: Remove installed tooling
    cmds:
      - rm -rf {{.BIN}}
