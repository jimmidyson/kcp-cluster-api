baseURL = "https://jimmidyson.github.io/kcp-cluster-api/"
title = "kcp-cluster-api"

enableRobotsTXT = true
enableGitInfo = true

# We don't use tags/categories taxonomies for this site.
disableKinds = ["taxonomy"]

contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableMissingTranslationPlaceholders = false

disableAliases = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser.attribute]
      block = true
  [markup.highlight]
    style = "tango"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = false

[module]
  [[module.imports]]
    path = "github.com/google/docsy/theme"

[params]
  copyright = "kcp-cluster-api contributors"
  privacy_policy = ""

  # Repo config used by the "Edit this page" / "Create issue" links in Docsy.
  github_repo = "https://github.com/jimmidyson/kcp-cluster-api"
  github_subdir = "kcp/docs/site"
  github_branch = "main"

  # First one is picked as the Twitter card image.
  offlineSearch = false
  prism_syntax_highlighting = false

  [params.ui]
    breadcrumb_disable = false
    navbar_logo = false
    sidebar_menu_compact = true
    sidebar_search_disable = false
    footer_about_enable = false

    [params.ui.feedback]
      enable = false

    [params.ui.readingtime]
      enable = false

[[menu.main]]
  name = "User Docs"
  weight = 10
  url = "/docs/user/"

[[menu.main]]
  name = "Design & Architecture"
  weight = 20
  url = "/docs/design/"

[[menu.main]]
  name = "GitHub"
  weight = 30
  url = "https://github.com/jimmidyson/kcp-cluster-api"
  pre = "<i class='fab fa-github'></i>"
